<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes System Design API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes API Client</h1>
    </header>

    <main>
        <section class="controls">
            <button id="load-btn">Load notes</button>
            <p id="status"></p>
        </section>

        <section class="form-section">
            <h2>Create a Note</h2>
            <form id="note-form">
                <div>
                    <label for="title-input">Title (Required, max 100 chars):</label>
                    <input type="text" id="title-input" placeholder="Note title...">
                </div>
                <div>
                    <label for="body-input">Body (Optional):</label>
                    <textarea id="body-input" placeholder="Note content..."></textarea>
                </div>
                <button type="submit" id="submit-btn">Create Note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Your Notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
